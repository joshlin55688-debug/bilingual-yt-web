<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雙語 YT</title>
<meta name="description" content="貼上 YouTube 網址，用你自己的 Gemini API 金鑰產生雙語字幕與逐字稿。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5b6475; --line: #dfe3ea;
    --accent: #1a5fb4; --accent-soft: #e5eefa; --cur: #fff4c2; --danger: #b42318;
    --sub-bg: rgba(0, 0, 0, .72); --sub-tr: #ffe28a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1d2128; --text: #e7eaf0; --muted: #9aa3b2; --line: #2e3440; --accent: #78a9ff; --accent-soft: #1f2d44; --cur: #3a3418; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; min-height: 42px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.on { background: var(--accent-soft); border-color: var(--accent); }
  input[type=text], input[type=password], select, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; min-height: 42px; min-width: 0; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 6px 0 0; white-space: nowrap; }
  #url { flex: 1 1 260px; }
  #app { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px 12px 16px; }
  @media (orientation: landscape) and (min-width: 900px) {
    #app { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); height: calc(100% - 64px); }
    #side { min-height: 0; }
  }
  #left { min-width: 0; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  #stage iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #stage:fullscreen { border-radius: 0; aspect-ratio: auto; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfd6e2; padding: 24px; text-align: center; }
  #subs { position: absolute; left: 4%; right: 4%; bottom: 15%; display: flex; justify-content: center; pointer-events: none; z-index: 5; }
  #subs .box { pointer-events: auto; background: var(--sub-bg); color: #fff; border-radius: 8px; padding: 6px 12px; text-align: center; max-width: 100%; font-size: clamp(15px, 2.4vw, 26px); line-height: 1.35; }
  #stage:fullscreen #subs .box { font-size: clamp(20px, 2.8vw, 40px); }
  #subs .tr { color: var(--sub-tr); }
  #subs .box:empty { display: none; }
  .blur .tr { filter: blur(6px); transition: filter .15s; }
  .blur .tr.peek, .blur:hover .tr { filter: none; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  #status { margin-top: 6px; color: var(--muted); font-size: 14px; min-height: 21px; }
  #status.err { color: var(--danger); }
  #startRow { display: none; margin-top: 8px; padding: 10px 12px; background: var(--accent-soft); border-radius: 10px; gap: 10px; align-items: center; flex-wrap: wrap; }
  #side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 320px; }
  #sideHead { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  #list { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; max-height: 60vh; }
  @media (orientation: landscape) and (min-width: 900px) { #list { max-height: none; } }
  .row { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 48px 1fr; gap: 6px; }
  .row.cur { background: var(--cur); }
  .row time { color: var(--muted); font-size: 13px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .row .o { font-size: 16px; }
  .row .t { color: var(--muted); font-size: 15px; }
  .w { border-radius: 4px; }
  .w:active, .w.sel { background: var(--accent-soft); }
  #card { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 14px 16px; display: none; z-index: 50; }
  #card .word { font-size: 20px; font-weight: 700; }
  #card .ph { color: var(--muted); margin-left: 8px; }
  #card .pos { display: inline-block; font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin: 8px 6px 2px 0; }
  #card .x { position: absolute; top: 6px; right: 6px; min-height: 36px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); width: min(640px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { padding: 16px; display: grid; gap: 12px; }
  dialog label { display: grid; gap: 4px; }
  .hint { color: var(--muted); font-size: 13px; }
  .rowflex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  textarea { min-height: 80px; resize: vertical; }
  pre#usage { white-space: pre-wrap; margin: 0; font: 13px/1.5 inherit; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>雙語 YT</h1>
  <input id="url" type="text" inputmode="url" placeholder="貼上 YouTube 影片網址" autocomplete="off">
  <select id="videoLang" title="影片講的語言">
    <option value="en-US">英文</option><option value="ja-JP">日文</option><option value="ko-KR">韓文</option>
    <option value="zh-TW">中文（台灣）</option><option value="zh-CN">中文（中國）</option>
    <option value="es-ES">西班牙文</option><option value="fr-FR">法文</option><option value="de-DE">德文</option>
  </select>
  <button id="load" class="primary">載入</button>
  <button id="openSettings">設定</button>
</header>
<div id="app">
  <section id="left">
    <div id="stage">
      <div id="empty">貼上 YouTube 影片網址，按「載入」。<br>第一次使用請先到「設定」填 Gemini API 金鑰。</div>
      <div id="yt"></div>
      <div id="subs"><div class="box"></div></div>
    </div>
    <div id="startRow"><span id="estimate"></span><button id="start" class="primary">開始產生字幕</button></div>
    <div id="controls">
      <button id="prev" title="上一句">⏮ 上一句</button>
      <button id="replay" title="重播這句">↺ 重播</button>
      <button id="next" title="下一句">下一句 ⏭</button>
      <button id="autoPause" title="每句播完自動暫停">句尾暫停</button>
      <select id="subStyle" title="字幕樣式">
        <option value="dual">原文＋譯文</option><option value="translation">只顯示譯文</option><option value="blur">譯文模糊</option>
      </select>
      <button id="fs" title="全螢幕（字幕會跟著）">⛶ 全螢幕</button>
      <button id="srt" title="下載雙語字幕">下載 SRT</button>
      <button id="stop">停止</button>
    </div>
    <div id="status" role="status"></div>
  </section>
  <aside id="side">
    <div id="sideHead">逐字稿：點一句跳過去，點單字查字典</div>
    <div id="list"></div>
  </aside>
</div>
<div id="card" role="dialog" aria-live="polite"><button class="x" id="cardClose" aria-label="關閉">✕</button><div id="cardBody"></div></div>

<dialog id="settings">
  <form method="dialog">
    <div class="rowflex" style="justify-content:space-between"><strong>設定</strong><button value="close">完成</button></div>
    <label>Gemini API 金鑰
      <span class="hint">到 aistudio.google.com/apikey 申請。只存在這台裝置的這個瀏覽器裡，只送給 Google Gemini。建議另外申請一把、在 Google 那邊設用量上限。</span>
      <div class="rowflex"><input id="apiKey" type="password" autocomplete="off" style="flex:1"><button type="button" id="showKey">顯示</button></div>
    </label>
    <div class="rowflex"><button type="button" id="test">測試連線</button><span id="testResult" class="hint"></span></div>
    <label>翻譯成
      <select id="targetLang">
        <option value="zh-TW">繁體中文（台灣）</option><option value="zh-CN">簡體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option>
      </select>
    </label>
    <label>翻譯模型
      <span class="hint">gemini-3.5-flash-lite 最便宜；gemini-3.8-flash 品質通常較好、較貴。轉錄固定用 flash-lite。</span>
      <input id="model" type="text" list="models"><datalist id="models"><option value="gemini-3.5-flash-lite"><option value="gemini-3.8-flash"></datalist>
    </label>
    <label>術語表
      <span class="hint">一行一個「原文 = 譯文」，右邊留空代表保留原文。例如：TSMC = 台積電</span>
      <textarea id="glossary"></textarea>
    </label>
    <label>額外指示
      <span class="hint">例如：這是字幕，譯文要口語、簡短。不能推翻內建規則。</span>
      <textarea id="instructions"></textarea>
    </label>
    <div><strong>用量與費用估算</strong> <span class="hint">（依 Gemini 回傳的 token 數估算，實際以 Google 帳單為準）</span><pre id="usage"></pre>
      <div class="rowflex" style="margin-top:6px"><button type="button" id="resetUsage">用量歸零</button><button type="button" id="clearCache">清除已轉錄、已翻譯的快取</button></div>
    </div>
  </form>
</dialog>

<script src="lib/core.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
